[package]
name = "backbone-payroll"
version = "0.3.47"
edition = "2021"
description = "Payroll: salary structures, payroll runs and computed salary slips over effective-dated statutory tables, plus compensation changes"
license = "MIT OR Apache-2.0"
repository = "https://github.com/faridlab/backbone-payroll"
exclude = [".claude/", ".github/", "graphify-out/"]

[lib]
path = "src/lib.rs"

[dependencies]
# -----------------------------------------------------------------------------
# Backbone Framework crates
#
# Pulled directly from the public framework repository so this skeleton works
# anywhere on disk without path fix-up. For reproducible builds, pin to a
# specific tag or commit by replacing `branch = "main"` with `tag = "vX.Y.Z"`
# or `rev = "<commit-sha>"`. Cargo dedupes the git fetch — the repo is only
# cloned once even though four crates reference it.
# -----------------------------------------------------------------------------
backbone-core = { version = "2.7.35", features = ["postgres"] }
backbone-orm = { version = "2.7.35" }
# `axum` feature required for the CompanyContext extractor the guarded routes use; without it
# the `company` module isn't exported and lib-only builds (clippy/check without dev-deps'
# feature unification) fail to resolve the import.
backbone-auth = { version = "2.7.35", features = ["axum"] }
backbone-messaging = { version = "2.7.35" }
# Transactional-outbox consumer (ADR-005): the `promotion.salary` + `offboarding.settlement` handlers
# dedup via `inbox::once` in the same tx as the compensation_changes insert. Pinned to the same tags
# the rest of the HR constellation (employee/recruitment/lifecycle) uses so the
# `IntegrationEventHandler` trait unifies across modules; the HR composer's [patch] block unifies
# backbone-outbox onto local HEAD for dev.
backbone-outbox = { version = "2.7.35" }

# Core async runtime and serialization
tokio = { version = "1.0", features = ["full"] }
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
# Money/quantities — near-universal in domain modules. Generated code for any `decimal`
# field imports rust_decimal, so ship it (and the matching sqlx feature) by default.
rust_decimal = { version = "1.36", features = ["serde"] }

# Database (PostgreSQL primary)
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json", "migrate", "rust_decimal"] }

# HTTP framework (Axum)
axum = { version = "0.7", features = ["macros"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Validation
validator = { version = "0.16", features = ["derive"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Configuration
config = "0.14"
serde_yaml = "0.9"

# Protocol Buffers (Generated from Schema-First YAML)
tonic = "0.12"
prost = "0.13"
prost-types = "0.13"

# OpenAPI schema derive. The generator emits `use utoipa::ToSchema;` in every
# entity and DTO behind the `openapi` feature, so the crate only builds with that
# feature on when the derive's crate is present: a feature that cannot compile is
# not a feature.
utoipa = { version = "5", features = ["chrono", "uuid", "decimal"] }

[features]
default = []
events = []
auth = []
grpc = []
openapi = []
validation = []

[build-dependencies]
tonic-build = "0.12"

[dev-dependencies]
tempfile = "3.0"
tokio-test = "0.4"
mockall = "0.12"
pretty_assertions = "1.0"

# Integration testing framework — the generated tests/integration_tests.rs hits a live server
# via reqwest; guarded-route probes hit the router in-process via tower's ServiceExt::oneshot.
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
jsonwebtoken = "9.3"
rand = "0.8"

# TEST-ONLY edges: the salary run posts ONE balanced journal into the REAL backbone-accounting ledger
# via an in-test ACL adapter (GlPostSink), and derives `unpaid_days` from the THREE decomposed workforce
# read-ports — backbone-attendance (present_days), backbone-timeoff (paid_leave_days), backbone-calendar
# (working_days) — writing setup through backbone-employee + backbone-timeoff. Dev-dependencies ONLY —
# the shipped library has ZERO normal Cargo edge to any of them.
backbone-accounting = { version = "0.9.27" }
backbone-employee = { version = "0.2.45" }
backbone-attendance = { version = "0.6.38" }
backbone-timeoff = { version = "0.4.33" }
backbone-calendar = { version = "0.2.27" }
