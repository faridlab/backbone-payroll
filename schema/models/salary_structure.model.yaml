# =============================================================================
# Domain: Payroll
# Entities: SalaryStructure (+ SalaryComponent)
# Description: A reusable pay template — its components are the earnings (basic, allowances) and fixed
# deductions that make up a salary slip. Each component names the GL account it hits (earnings → salary
# expense; deductions → a payable). The Indonesia statutory deductions (BPJS, PPh 21) are NOT fixed
# components — they are supplied per slip by the deferred statutory overlay (like the tax overlay).
# Posts NO GL itself (the run posts).
# =============================================================================

models:
  # Tenancy: none, by design (ADR-0029). Tenant-agnostic and reusable; a composing
  # service's tenancy decorator owns org scoping for both tables in this file —
  # components scope with their parent structure, no denormalized column needed.
  - name: SalaryStructure
    collection: salary_structures
    description: "A reusable pay template (earnings + fixed deductions)"
    fields:
      id:
        type: uuid
        attributes: ["@id", "@default(uuid)"]
        description: "Unique structure id"
      name:
        type: string
        attributes: ["@required", "@max(140)"]
        description: "Structure name (e.g. 'Staff Bulanan')"
      status:
        type: SalaryStructureStatus
        attributes: ["@default(active)"]
        description: "Only active structures may back new slips"
      metadata:
        type: Metadata
        attributes: ["@audit_metadata"]
        description: "Audit metadata"
    indexes:
      # No tenancy indexes (ADR-0029): the module is tenant-agnostic. The
      # company-leading status listing index is a tenancy read path and is not
      # declared here; the composing decorator's org fence covers the reads.

  - name: SalaryComponent
    collection: salary_components
    description: "One earning or deduction line in a structure, with the GL account it hits"
    fields:
      id:
        type: uuid
        attributes: ["@id", "@default(uuid)"]
        description: "Unique component id"
      structure_id:
        type: uuid
        attributes: ["@required", "@foreign_key(SalaryStructure.id)"]
        description: "Parent structure"
      name:
        type: string
        attributes: ["@required", "@max(140)"]
        description: "Component name (Gaji Pokok, Tunjangan Transport, Potongan Koperasi)"
      component_type:
        type: ComponentType
        attributes: ["@required", "@default(earning)"]
        description: "earning (adds to gross) or deduction (subtracts)"
      amount:
        type: decimal
        attributes: ["@default(0)", "@precision(18,2)", "@non_negative"]
        description: "Fixed monthly amount (IDR)"
      gl_account_id:
        type: uuid
        attributes: ["@required", "@exclude_from_foreign_key_check"]
        description: "GL account # logical FK to accounting.Account.id (expense for earnings, payable for deductions)"
      is_statutory:
        type: boolean
        attributes: ["@default(false)"]
        description: "This component is a statutory deduction (BPJS, PPh 21) — the split between what the state takes and what the company deducts is visible on the structure before a slip is produced. The slip line keeps its own copy for historically accurate runs when the rules change."
      metadata:
        type: Metadata
        attributes: ["@audit_metadata"]
        description: "Audit metadata"
    indexes:
      - type: index
        fields: [structure_id]

  # A salary component's versions, each with the date it takes effect. A change is planned from a
  # date: the run for a period reads the version in force on the period's first day, the same rule
  # the statutory parameters follow. A component with versions is paid only from its first one and
  # not from a version marked removed. Written only by the schedule-a-change verb; the component
  # row itself carries the version in force today.
  - name: SalaryComponentVersion
    collection: salary_component_versions
    # Data-change audit capture (ADR-0025): who planned each version, and when.
    audited: true
    read_only: true
    description: "A salary component as it stands from a date: amount, type, statutory flag and GL account"
    fields:
      id:
        type: uuid
        attributes: ["@id", "@default(uuid)"]
        description: "Unique version id"
      component_id:
        type: uuid
        attributes: ["@required", "@foreign_key(SalaryComponent.id)"]
        description: "The component this version belongs to"
      effective_from:
        type: date
        attributes: ["@required"]
        description: "The first day this version is in force"
      name:
        type: string
        attributes: ["@required", "@max(140)"]
        description: "Component name from that date"
      component_type:
        type: ComponentType
        attributes: ["@required", "@default(earning)"]
        description: "earning or deduction from that date"
      amount:
        type: decimal
        attributes: ["@default(0)", "@precision(18,2)", "@non_negative"]
        description: "Fixed monthly amount (IDR) from that date"
      gl_account_id:
        type: uuid
        attributes: ["@required", "@exclude_from_foreign_key_check"]
        description: "GL account # logical FK to accounting.Account.id"
      is_statutory:
        type: boolean
        attributes: ["@default(false)"]
        description: "A statutory marker from that date (its amount is the rule's, not this one)"
      removed:
        type: boolean
        attributes: ["@default(false)"]
        description: "The component is no longer paid from that date"
      reason:
        type: string?
        attributes: ["@max(500)"]
        description: "Why the component changes (a new regulation, an annual review)"
      metadata:
        type: Metadata
        attributes: ["@audit_metadata"]
        description: "Audit metadata"
    indexes:
      - type: unique
        fields: [component_id, effective_from]

enums:
  - name: SalaryStructureStatus
    description: "Lifecycle of a salary structure"
    variants:
      - name: active
        description: "New salary slips may use this structure"
        default: true
      - name: inactive
        description: "Retired; historical slips keep referencing it"

  - name: ComponentType
    description: "Whether a component adds to gross pay or is deducted"
    variants:
      - name: earning
        description: "Adds to gross pay"
        default: true
      - name: deduction
        description: "Subtracted from gross"
